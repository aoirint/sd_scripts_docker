[project]
name = "sd-scripts-docker"
version = "0.0.0"
requires-python = "==3.12.*"

# Originally copied from kohya-ss/sd-scripts
# https://github.com/kohya-ss/sd-scripts/blob/690ea7f96c23182352ec63def76d431c6120bd2f/requirements.txt
dependencies = [
  "accelerate==1.15.0",
  "transformers==5.17.0",
  "diffusers[torch]==0.40.0",
  "ftfy==6.3.1",
  'opencv-python==4.10.0.84; platform_machine != "ARM64"',
  "einops==0.7.0",
  "bitsandbytes",
  "lion-pytorch==0.2.3",
  "schedulefree==1.4.1",
  "pytorch-optimizer==3.10.0",
  "prodigy-plus-schedule-free==1.9.2",
  "prodigyopt==1.1.2",
  'tensorboard; platform_machine != "ARM64"',
  'tensorboardX; platform_machine == "ARM64"',
  "safetensors==0.8.0",
  "toml==0.10.2",
  "voluptuous==0.15.2",
  "huggingface-hub==1.32.0",
  # for Image utils
  "imagesize==1.4.1",
  "numpy",
  # for BLIP captioning
  "requests==2.33.0",
  "timm==0.6.12",
  "fairscale==0.4.13",
  # for WD14 captioning (onnx)
  "onnx==1.22.0",
  "onnxruntime-gpu==1.23.2",
  # open clip for SDXL
  "open-clip-torch==2.26.1",
  # For logging
  "rich==14.1.0",
  # for T5XXL tokenizer (SD3/FLUX)
  "sentencepiece==0.2.1",
  # PyTorch
  "torch==2.13.0+cu130",
  "torchvision==0.28.0+cu130",
  "xformers==0.0.35",
  # Additional bundle
  # https://github.com/KohakuBlueleaf/LyCORIS
  "lycoris-lora==3.1.1.post1",
]

[tool.uv]
package = false
exclude-newer = "P7D"
# Temporary exceptions for upstream security fixes; remove after 2026-10-27 UTC.
# https://github.com/certifi/python-certifi/security/advisories/GHSA-6q48-6c7w-9gw2
# https://github.com/tox-dev/filelock/security/advisories/GHSA-2g95-wg33-c5x2
# https://github.com/pypa/setuptools/security/advisories/GHSA-xmj3-9gf7-h52w
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", filelock = "2026-10-18T00:00:00Z", setuptools = "2026-10-20T00:00:00Z" }
constraint-dependencies = [
  "certifi>=2026.10.19",
  "filelock>=4.2.1",
  "setuptools==84.1.0",
  "pillow>=13.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
xformers = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]
