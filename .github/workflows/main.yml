name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: aoirint/sd_scripts
  GHCR_IMAGE_NAME: ghcr.io/aoirint/sd_scripts

jobs:
  check:
    name: Check
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Docker source
        uses: ./.github/actions/check-docker-source

  plan:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      publish_application: ${{ steps.scope.outputs.publish_application }}
      release_mode: ${{ steps.version.outputs.release_mode }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify application changes
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: bash .github/scripts/application-change-scope.sh

      - name: Read release version
        id: version
        run: |-
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain stable or prerelease SemVer" >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "${version}" == "0.0.0" ]] || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            release_mode=edge
          elif [[ "${version}" == *-* ]]; then
            release_mode=prerelease
          else
            release_mode=latest
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_mode=${release_mode}" >> "$GITHUB_OUTPUT"

  build:
    # APM maintenance still runs Check; image publishing needs application changes.
    if: needs.plan.outputs.publish_application == 'true'
    needs: [check, plan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space for image build
        run: |-
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" /opt/google/chrome /opt/microsoft/msedge /opt/microsoft/powershell /opt/pipx /usr/lib/mono /usr/local/julia* /usr/local/lib/android /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/share/dotnet /usr/share/swift
          df -h /
      - name: Checkout integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Derive Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ needs.plan.outputs.release_mode != 'latest' }}
            type=raw,value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.release_mode == 'latest' }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.release_mode == 'latest' }}
      - name: Derive build cache references
        id: cache
        run: |-
          if [[ "${{ needs.plan.outputs.release_mode }}" == "latest" ]]; then
            echo "cache_from=type=registry,ref=${{ env.GHCR_IMAGE_NAME }}:edge-buildcache" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=registry,ref=${{ env.GHCR_IMAGE_NAME }}:buildcache,mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "cache_from=type=registry,ref=${{ env.GHCR_IMAGE_NAME }}:edge-buildcache" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=registry,ref=${{ env.GHCR_IMAGE_NAME }}:edge-buildcache,mode=max" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: ${{ steps.cache.outputs.cache_from }}
          cache-to: ${{ steps.cache.outputs.cache_to }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  test:
    needs: [build, plan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space for release tests
        run: |-
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" /opt/google/chrome /opt/microsoft/msedge /opt/microsoft/powershell /opt/pipx /usr/lib/mono /usr/local/julia* /usr/local/lib/android /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/share/dotnet /usr/share/swift
          df -h /
      - name: Checkout integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the exact published image
        id: image
        run: |-
          if [[ "${{ needs.plan.outputs.release_mode }}" == "latest" ]]; then
            image="${{ env.GHCR_IMAGE_NAME }}:${{ needs.plan.outputs.tag }}"
          else
            image="${{ env.GHCR_IMAGE_NAME }}:edge"
          fi
          docker pull "${image}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - name: Run upstream sd-scripts release tests
        run: scripts/run-sd-scripts-release-tests.sh --image "${{ steps.image.outputs.image }}"

  release:
    needs: [plan, test]
    if: ${{ needs.plan.outputs.release_mode != 'edge' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish immutable GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.plan.outputs.tag }}
          commit: ${{ github.sha }}
          immutableCreate: true
          prerelease: ${{ needs.plan.outputs.release_mode == 'prerelease' }}
          makeLatest: ${{ needs.plan.outputs.release_mode == 'latest' }}
          generateReleaseNotes: true
