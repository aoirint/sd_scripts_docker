name: Check Docker source
description: Audit APM and lint Markdown source before Docker frontend checks.

runs:
  using: composite
  steps:
    - name: Set up reviewed APM CLI
      uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
      with:
        apm-version: "0.35.0"
        setup-only: "true"

    - name: Audit APM deployment
      shell: bash
      run: apm audit --ci

    - name: Lint Markdown source
      uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      with:
        config: .markdownlint-cli2.yaml
        globs: "**/*.md"
